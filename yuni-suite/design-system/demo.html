<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yuni components</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css">
<style>main{max-width:480px;margin:0 auto;padding:24px 16px 96px;display:grid;gap:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head><body><main>
<h1>yuni components</h1>
<div class="row"><button class="btn btn--primary">Primary</button><button class="btn btn--ink">Ink</button><button class="btn btn--ghost">Ghost</button><button class="btn btn--joy">Joy</button></div>
<div class="row"><button class="chip" aria-pressed="true">Year 2</button><button class="chip">Sports</button><button class="chip">Events</button></div>
<input class="input" placeholder="Search LT, lab, hostel...">
<div class="card"><div class="row"><span class="badge badge--scope">Year 2</span><span class="badge badge--synced">Synced</span></div>
<h2>Physiology Lecture</h2><p class="num">LT 3 · 08:00 to 10:00</p></div>
<div class="card card--urgent"><span class="badge badge--live">Urgent</span><p>Example urgent announcement.</p></div>
<div class="card"><h2>Which topic first?</h2>
<div style="display:grid;gap:8px"><button class="poll-option" role="radio" aria-checked="true"><span class="poll-option__fill" style="--pct:62%"></span><span>Anatomy</span><span class="num">62%</span></button>
<button class="poll-option" role="radio" aria-checked="false"><span class="poll-option__fill" style="--pct:38%"></span><span>Physiology</span><span class="num">38%</span></button></div>
<p><span class="badge badge--pending">Pending</span> vote sends when you're online</p></div>
<div class="proposal"><strong>Proposed plan</strong><p>3 sessions before Friday's test.</p>
<div class="proposal__actions"><button class="btn btn--primary">Approve</button><button class="btn btn--ghost">Edit</button><button class="btn btn--ghost">Dismiss</button></div></div>
</main>
<nav class="bottom-nav"><a href="#" aria-current="page">Home</a><a href="#">Study</a><a href="#">Map</a><a href="#">Feed</a><a href="#">Me</a></nav>
</body></html>
